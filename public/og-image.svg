<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Ambient light glows -->
  <circle cx="200" cy="180" r="260" fill="#2563eb" opacity="0.18" filter="url(#glow)" />
  <circle cx="1020" cy="460" r="300" fill="#7c3aed" opacity="0.15" filter="url(#glow)" />

  <!-- Geometric grid accent -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- App Icon Badge -->
  <g transform="translate(140, 130)">
    <rect width="96" height="96" rx="24" fill="url(#brandGrad)" />
    <!-- Message bubble icon -->
    <path d="M68 53a6 6 0 0 1-6 6H31.5a6 6 0 0 0-4.24 1.76L20.6 67.4A2.1 2.1 0 0 1 17 65.9V23a6 6 0 0 1 6-6h45a6 6 0 0 1 6 6z" fill="#ffffff" />
  </g>

  <!-- Brand Title -->
  <text x="260" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1.5">SayHola</text>
  <rect x="525" y="155" width="145" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="597" y="179" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#60a5fa" text-anchor="middle" letter-spacing="1">PUBLIC ROOM</text>

  <!-- Tagline H1 -->
  <text x="140" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#f8fafc" letter-spacing="-1">
    Free Real-Time Public Chat
  </text>
  <text x="140" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="34" fill="#94a3b8">
    Instant online chat room with zero registration.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(140, 430)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="26" r="6" fill="#10b981" />
    <text x="50" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#e2e8f0">No Registration</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="230" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="270" cy="26" r="6" fill="#3b82f6" />
    <text x="290" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#e2e8f0">Real-Time Messaging</text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="210" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="520" cy="26" r="6" fill="#8b5cf6" />
    <text x="540" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#e2e8f0">Free &amp; Moderated</text>
  </g>

  <!-- Footer branding note -->
  <text x="140" y="555" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#64748b">
    A product by MK Labs • Works on Mobile &amp; Desktop
  </text>
</svg>
